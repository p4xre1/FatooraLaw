<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Pinterest domain verification (site-wide: the prerender copies this
         static head into every public document). -->
    <meta name="p:domain_verify" content="ee462d6380d753c66209a0d769299a3f" />
    <!-- SECURITY: anti-injection / anti-reverse meta -->
    <!-- figma:head-end -->
    <!-- figma:route-head-start -->
    <!-- The block between these markers is rewritten per route: by the Vite
         plugin for the fallback/default document, and by scripts/prerender.mjs
         for every public page (title, description, canonical, Open Graph and
         the per-page JSON-LD). Keep the markers on their own lines. -->
    <title><!-- figma:title --></title>
    <meta name="description" content="" />
    <link rel="canonical" href="/" />
    <!-- figma:route-head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"><!-- figma:prerender-start --><!-- figma:prerender-end --></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/anti-reverse-engineering.js" defer></script>
    <!-- figma:body-end -->
  </body>
</html>
